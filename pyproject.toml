[project]
name = "ehr-extractor"
version = "0.1.0"
description = "Agentic EHR Extraction Pipeline for unstructured clinical documents"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
    "json5>=0.14.0",
    "langchain>=1.3.0",
    "langchain-openai>=1.2.1",
    "langgraph>=1.2.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "structlog>=25.5.0",
]

[project.scripts]
ehr-extract = "ehr.pipeline.main:main"
ehr-evaluate = "ehr.evaluation.evaluate:main"
ehr-compare = "ehr.evaluation.compare:main"
ehr-pharmacy = "ehr.evaluation.pharmacy:main"
ehr-significance = "ehr.evaluation.significance:main"
ehr-interrater = "ehr.evaluation.interrater:main"
ehr-agreement-stats = "ehr.evaluation.agreement_stats:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ehr"]

[dependency-groups]
# Dev-only; not part of the published package's runtime dependencies.
dev = ["pytest>=8.0", "ruff>=0.6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Ruff's default rules (pyflakes + a pragmatic pycodestyle subset). The compact
# semicolon style in the scoring/pharmacy loops is intentional.
ignore = ["E701", "E702"]

[tool.ruff.lint.per-file-ignores]
"src/ehr/pipeline/main.py" = ["E402"]  # load_dotenv() must precede env-reading imports

[tool.pyright]
include = ["src", "tests"]
exclude = ["_refactor_guard", "**/__pycache__"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
